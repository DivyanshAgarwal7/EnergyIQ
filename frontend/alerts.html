<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnergyIQ — Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .toggle-tabs { display:flex; gap:4px; background:var(--bg-card); border:1px solid var(--border);
    border-radius:var(--radius); padding:4px; width:fit-content; margin-bottom:20px; }
  .tab-btn { padding:6px 18px; border-radius:6px; border:none; background:transparent;
    color:var(--text-secondary); font-family:'DM Sans',sans-serif; font-size:0.85rem;
    cursor:pointer; transition:background 0.15s,color 0.15s; }
  .tab-btn.active { background:var(--bg-hover); color:var(--text-primary); font-weight:500; }
  .resolve-all-btn { margin-bottom:16px; }
  .empty-state { text-align:center; padding:48px; color:var(--text-muted); }
  .empty-icon  { font-size:2rem; margin-bottom:12px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <span class="logo-icon"></span>
    <span class="logo-text">Enerlytics</span>
  </div>
  <nav class="nav">
    <a href="index.html"     class="nav-item">      <span class="nav-icon">▦</span> Dashboard</a>
    <a href="analytics.html" class="nav-item">       <span class="nav-icon">◈</span> Analytics</a>
    <a href="alerts.html"    class="nav-item active"><span class="nav-icon">◉</span> Alerts
      <span class="badge" id="alert-badge" style="display:none">!</span></a>
    <a href="devices.html"   class="nav-item">       <span class="nav-icon">◎</span> Devices</a>
  </nav>
  <div class="sidebar-footer"><span class="mono">v1.0 · Phase 1</span></div>
</aside>

<main class="main">

  <header class="page-header">
    <div>
      <h1>Alerts</h1>
      <p class="subtitle">Auto-generated by triggers · resolve when actioned</p>
    </div>
    <div class="header-controls">
      <span class="mono" id="open-count" style="color:var(--text-muted);font-size:0.8rem"></span>
    </div>
  </header>

  <div class="toggle-tabs">
    <button class="tab-btn active" id="tab-open"     onclick="switchTab('open')">Open</button>
    <button class="tab-btn"        id="tab-resolved" onclick="switchTab('resolved')">Resolved</button>
  </div>

  <div id="alerts-container">
    <div class="loading-row">Loading...</div>
  </div>

</main>

<script src="js/api.js"></script>
<script src="js/alerts.js"></script>
</body>
</html>
